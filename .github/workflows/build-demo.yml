name: Offline demo APK
on:
  push:
    branches: [offline-demo]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: offline-demo/**/*.gradle
      - name: Set up cloud Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install cloud Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build, unit tests and lint
        working-directory: offline-demo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check APK isolation and signing
        working-directory: offline-demo
        run: |
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk "$(command -v apkanalyzer)"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Enable cloud emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify on cloud Android emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash offline-demo/tools/emulator-smoke.sh
      - name: Upload installable demo APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smart-routine-offline-demo-apk
          path: offline-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports and real emulator captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-demo-review
          path: |
            offline-demo/app/build/reports/
            offline-demo/screenshots/
          if-no-files-found: warn
          retention-days: 14
