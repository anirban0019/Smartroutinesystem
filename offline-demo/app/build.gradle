plugins { id 'com.android.application' }

def sharedDisplay = layout.buildDirectory.dir('generated/shared-display')
def copySharedDisplay = tasks.register('copySharedDisplay', Sync) {
    from('../../app/src/main/java') {
        include 'com/example/smartroutinesystem/ViewData.java',
                'com/example/smartroutinesystem/RoutineHolder.java',
                'com/example/smartroutinesystem/RoutineAdapter.java',
                'com/example/smartroutinesystem/GridAdapter.java',
                'com/example/smartroutinesystem/Notice.java',
                'com/example/smartroutinesystem/NoticeAdapter.java'
    }
    into(sharedDisplay)
}

android {
    // Original adapters refer to this R namespace; applicationId is independent.
    namespace 'com.example.smartroutinesystem'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.smartroutinesystem.demo'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0-demo'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            // Reuse real original XML and display code, never Firebase controllers.
            res.srcDirs = ['../../app/src/main/res']
            java.srcDirs = ['src/main/java', sharedDisplay.get().asFile]
        }
    }
    lint { abortOnError true }
}
tasks.named('preBuild').configure { dependsOn(copySharedDisplay) }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
